<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Form – Quran Chapter</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f4f3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .form-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(3, 47, 43, 0.12);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 480px;
    }

    .form-logo {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .form-logo h2 {
      color: #032f2b;
      font-size: 1.5rem;
      font-weight: 700;
    }

    .form-logo p {
      color: #6b7280;
      font-size: 0.875rem;
      margin-top: 0.25rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    textarea {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.95rem;
      color: #111827;
      background: #f9fafb;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: #07866B;
      box-shadow: 0 0 0 3px rgba(7, 134, 107, 0.12);
      background: #fff;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    .submit-btn {
      width: 100%;
      padding: 0.875rem;
      background: linear-gradient(135deg, #E5C365, #C79A2B);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      letter-spacing: 0.04em;
      box-shadow: 0 6px 20px rgba(199, 154, 43, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 0.5rem;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(199, 154, 43, 0.45);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .success-msg {
      display: none;
      background: #ecfdf5;
      border: 1px solid #6ee7b7;
      color: #065f46;
      border-radius: 8px;
      padding: 0.875rem 1rem;
      font-size: 0.9rem;
      margin-top: 1rem;
      text-align: center;
    }

    .error-msg {
      display: none;
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #991b1b;
      border-radius: 8px;
      padding: 0.875rem 1rem;
      font-size: 0.9rem;
      margin-top: 1rem;
      text-align: center;
    }

    @media (max-width: 480px) {
      .row { grid-template-columns: 1fr; }
      .form-card { padding: 2rem 1.25rem; }
    }
  </style>
</head>
<body>

  <div class="form-card">
    <div class="form-logo">
      <h2>Register Now</h2>
      <p>Book your free trial class at Quran Chapter Academy</p>
    </div>

    <form id="registerForm" action="https://quranchapter.com/wp-json/contact-form-7/v1/contact-forms/3442/feedback" method="POST">

      <!-- Required CF7 hidden fields -->
      <input type="hidden" name="_wpcf7" value="3442">
      <input type="hidden" name="_wpcf7_version" value="6.0.6">
      <input type="hidden" name="_wpcf7_locale" value="en_US">
      <input type="hidden" name="_wpcf7_unit_tag" value="wpcf7-f3442-p1-o1">
      <input type="hidden" name="_wpcf7_container_post" value="0">

      <div class="form-group">
        <label for="name">Your Name *</label>
        <input type="text" id="name" name="text-595" placeholder="Enter Your Name" required>
      </div>

      <div class="row">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email-743" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="phone">Phone / WhatsApp</label>
          <input type="tel" id="phone" name="tel-737" placeholder="+92 300 0000000">
        </div>
      </div>

      <div class="form-group">
        <label for="details">Additional Details</label>
        <textarea id="details" name="textarea-8" placeholder="Tell us about your learning goals, preferred schedule, or any questions..."></textarea>
      </div>

      <button type="submit" class="submit-btn">Register for Free Trial →</button>

      <div class="success-msg" id="successMsg">✓ Thank you! Your registration has been submitted. We'll be in touch shortly.</div>
      <div class="error-msg" id="errorMsg">✗ Something went wrong. Please try again or contact us directly.</div>

    </form>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const btn = this.querySelector('.submit-btn');
      const successMsg = document.getElementById('successMsg');
      const errorMsg = document.getElementById('errorMsg');

      btn.textContent = 'Sending...';
      btn.disabled = true;
      successMsg.style.display = 'none';
      errorMsg.style.display = 'none';

      const formData = new FormData(this);

      try {
        const res = await fetch(this.action, { method: 'POST', body: formData });
        const data = await res.json();

        if (data.status === 'mail_sent') {
          successMsg.style.display = 'block';
          this.reset();
        } else {
          errorMsg.textContent = data.message || 'Something went wrong. Please try again.';
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        errorMsg.style.display = 'block';
      }

      btn.textContent = 'Register for Free Trial →';
      btn.disabled = false;
    });
  </script>

</body>
</html>
